name: lavarapido-base-datos

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?Define POSTGRES_DB in local .env}
      POSTGRES_USER: ${POSTGRES_USER:?Define POSTGRES_USER in local .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Define POSTGRES_PASSWORD in local ignored .env}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:?Define POSTGRES_PORT in local .env}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U ${POSTGRES_USER:?Define POSTGRES_USER in local .env} -d ${POSTGRES_DB:?Define POSTGRES_DB in local .env}
      interval: 5s
      timeout: 5s
      retries: 10

  liquibase:
    build:
      context: .
      dockerfile: docker/liquibase/Dockerfile
    image: lavarapido-liquibase:5.0.2
    profiles:
      - tooling
    depends_on:
      postgres:
        condition: service_healthy
    working_dir: /workspace
    volumes:
      - ./:/workspace
    entrypoint:
      - liquibase
      - --search-path=/workspace
      - --changeLogFile=changelog-master.yaml
      - --classpath=/liquibase/liquibase_libs/postgresql-42.7.8.jar
      - --url=jdbc:postgresql://postgres:5432/${POSTGRES_DB:?Define POSTGRES_DB in local .env}
      - --username=${POSTGRES_USER:?Define POSTGRES_USER in local .env}
    environment:
      LIQUIBASE_COMMAND_PASSWORD: ${POSTGRES_PASSWORD:?Define POSTGRES_PASSWORD in local ignored .env}
    command: update

volumes:
  postgres_data:
